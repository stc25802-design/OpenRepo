<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Trump Games</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'M PLUS Rounded 1c', 'Poppins', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 3D Perspective for card flipping */
        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* Custom felt table background gradient */
        .felt-table {
            background: radial-gradient(circle at center, #1b5e20 0%, #0d3b13 70%, #051a08 100%);
        }

        /* Pulse glow animation for highlights */
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
            50% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.8); }
        }

        .glow-active {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between overflow-x-hidden felt-table">

    <!-- Header -->
    <header class="w-full bg-black/40 backdrop-blur-md border-b border-white/10 px-4 py-3 flex justify-between items-center z-10">
        <div class="flex items-center gap-2">
            <span class="text-red-500 text-2xl"><i class="fa-solid font-bold fa-suit-spade"></i></span>
            <h1 class="text-xl md:text-2xl font-bold tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-amber-200 to-yellow-500">
                TRUMP SUITE
            </h1>
        </div>

        <!-- Mode Selector Switch -->
        <div class="flex bg-black/50 p-1 rounded-xl border border-white/10">
            <button id="btn-mode-hl" onclick="switchGameMode('highlow')" class="px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition-all duration-200 bg-amber-500 text-black shadow-md">
                High & Low
            </button>
            <button id="btn-mode-bj" onclick="switchGameMode('blackjack')" class="px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition-all duration-200 text-gray-300 hover:text-white">
                Blackjack
            </button>
        </div>

        <!-- Audio Mute Toggle -->
        <button id="btn-sound" onclick="toggleSound()" class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition-all text-amber-400">
            <i class="fa-solid fa-volume-high"></i>
        </button>
    </header>

    <!-- Status / Score Bar -->
    <div class="max-w-4xl mx-auto w-full px-4 pt-4 grid grid-cols-3 gap-2 text-center">
        <div class="bg-black/30 backdrop-blur-sm rounded-xl p-2 border border-white/10">
            <div class="text-xs text-amber-200/70 font-semibold uppercase">チップ (Chips)</div>
            <div id="chips-display" class="text-lg md:text-2xl font-bold text-amber-400">1,000</div>
        </div>
        <div class="bg-black/30 backdrop-blur-sm rounded-xl p-2 border border-white/10">
            <div class="text-xs text-amber-200/70 font-semibold uppercase">ベット (Bet)</div>
            <div id="bet-display" class="text-lg md:text-2xl font-bold text-yellow-300">100</div>
        </div>
        <div class="bg-black/30 backdrop-blur-sm rounded-xl p-2 border border-white/10">
            <div id="score-label" class="text-xs text-amber-200/70 font-semibold uppercase">連勝 (Streak)</div>
            <div id="score-display" class="text-lg md:text-2xl font-bold text-emerald-400">0</div>
        </div>
    </div>

    <!-- Main Playing Area -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 py-4 max-w-4xl mx-auto w-full relative">
        
        <!-- HIGH & LOW GAME AREA -->
        <div id="highlow-game" class="w-full flex flex-col items-center gap-6">
            <!-- Instruction Text -->
            <div id="hl-message" class="text-center min-h-[40px] flex items-center justify-center">
                <p class="text-lg md:text-xl font-bold text-amber-100">次のカードは現在のカードより【高い】か【低い】か？</p>
            </div>

            <!-- Cards Container -->
            <div class="flex items-center justify-center gap-4 md:gap-12 my-2">
                <!-- Current Card -->
                <div class="flex flex-col items-center gap-2">
                    <span class="text-xs text-emerald-200/80 font-bold tracking-wider">現在のカード</span>
                    <div id="hl-card-1" class="w-28 h-40 md:w-36 md:h-52 perspective-1000">
                        <div class="card-inner w-full h-full relative rounded-xl shadow-2xl border-2 border-white/20">
                            <!-- JS populated -->
                        </div>
                    </div>
                </div>

                <!-- VS Badge -->
                <div class="text-2xl font-black text-amber-400/80 italic">VS</div>

                <!-- Next Card -->
                <div class="flex flex-col items-center gap-2">
                    <span class="text-xs text-emerald-200/80 font-bold tracking-wider">次のカード</span>
                    <div id="hl-card-2" class="w-28 h-40 md:w-36 md:h-52 perspective-1000">
                        <div class="card-inner w-full h-full relative rounded-xl shadow-2xl border-2 border-white/20">
                            <!-- JS populated -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bet Controls (Pre-game) -->
            <div id="hl-bet-controls" class="flex flex-wrap justify-center items-center gap-2 my-2">
                <span class="text-xs text-amber-200 w-full text-center mb-1">ベット額調整:</span>
                <button onclick="adjustBet(-50)" class="bg-red-900/60 hover:bg-red-800 text-red-200 text-xs px-3 py-1.5 rounded-lg border border-red-500/30 transition-all">-50</button>
                <button onclick="adjustBet(-10)" class="bg-red-900/40 hover:bg-red-800 text-red-200 text-xs px-3 py-1.5 rounded-lg border border-red-500/30 transition-all">-10</button>
                <button onclick="adjustBet(10)" class="bg-emerald-900/40 hover:bg-emerald-800 text-emerald-200 text-xs px-3 py-1.5 rounded-lg border border-emerald-500/30 transition-all">+10</button>
                <button onclick="adjustBet(50)" class="bg-emerald-900/60 hover:bg-emerald-800 text-emerald-200 text-xs px-3 py-1.5 rounded-lg border border-emerald-500/30 transition-all">+50</button>
            </div>

            <!-- Choice Action Buttons -->
            <div id="hl-action-buttons" class="flex gap-4 w-full max-w-xs">
                <button onclick="playHighLow('HIGH')" class="flex-1 bg-gradient-to-b from-emerald-500 to-emerald-700 hover:from-emerald-400 hover:to-emerald-600 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg border border-emerald-300/30 text-lg flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-arrow-up"></i> HIGH
                </button>
                <button onclick="playHighLow('LOW')" class="flex-1 bg-gradient-to-b from-rose-500 to-rose-700 hover:from-rose-400 hover:to-rose-600 active:scale-95 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg border border-rose-300/30 text-lg flex items-center justify-center gap-2 transition-all">
                    <i class="fa-solid fa-arrow-down"></i> LOW
                </button>
            </div>
        </div>

        <!-- BLACKJACK GAME AREA -->
        <div id="blackjack-game" class="w-full flex flex-col items-center gap-4 hidden">
            <!-- Dealer Zone -->
            <div class="w-full flex flex-col items-center gap-1">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-amber-200/80 font-bold uppercase tracking-widest">ディーラー</span>
                    <span id="dealer-score" class="text-xs font-bold bg-black/40 px-2 py-0.5 rounded-full text-amber-300">?</span>
                </div>
                <div id="dealer-cards" class="flex justify-center gap-2 md:gap-3 min-h-[110px] md:min-h-[140px] items-center">
                    <!-- Cards added via JS -->
                </div>
            </div>

            <!-- Game Center Message -->
            <div id="bj-message" class="text-center h-8 flex items-center justify-center">
                <p class="text-base md:text-lg font-bold text-amber-100">ヒットかスタンドを選択してください</p>
            </div>

            <!-- Player Zone -->
            <div class="w-full flex flex-col items-center gap-1">
                <div id="player-cards" class="flex justify-center gap-2 md:gap-3 min-h-[110px] md:min-h-[140px] items-center">
                    <!-- Cards added via JS -->
                </div>
                <div class="flex items-center gap-2 mt-1">
                    <span class="text-xs text-amber-200/80 font-bold uppercase tracking-widest">あなた</span>
                    <span id="player-score" class="text-xs font-bold bg-black/40 px-2 py-0.5 rounded-full text-emerald-300">0</span>
                </div>
            </div>

            <!-- Bet Controls -->
            <div id="bj-bet-controls" class="flex flex-wrap justify-center items-center gap-2 my-1">
                <button onclick="adjustBet(-50)" class="bg-red-900/60 hover:bg-red-800 text-red-200 text-xs px-3 py-1.5 rounded-lg border border-red-500/30 transition-all">-50</button>
                <button onclick="adjustBet(-10)" class="bg-red-900/40 hover:bg-red-800 text-red-200 text-xs px-3 py-1.5 rounded-lg border border-red-500/30 transition-all">-10</button>
                <button onclick="adjustBet(10)" class="bg-emerald-900/40 hover:bg-emerald-800 text-emerald-200 text-xs px-3 py-1.5 rounded-lg border border-emerald-500/30 transition-all">+10</button>
                <button onclick="adjustBet(50)" class="bg-emerald-900/60 hover:bg-emerald-800 text-emerald-200 text-xs px-3 py-1.5 rounded-lg border border-emerald-500/30 transition-all">+50</button>
            </div>

            <!-- Blackjack Action Buttons -->
            <div id="bj-action-buttons" class="flex gap-3 w-full max-w-sm justify-center">
                <button id="btn-deal" onclick="startBlackjackHand()" class="bg-gradient-to-b from-amber-400 to-amber-600 hover:from-amber-300 hover:to-amber-500 active:scale-95 text-slate-950 font-bold py-3 px-6 rounded-xl shadow-lg text-base transition-all">
                    ディール (ディール開始)
                </button>
                <button id="btn-hit" onclick="blackjackHit()" class="hidden bg-gradient-to-b from-blue-500 to-blue-700 hover:from-blue-400 hover:to-blue-600 active:scale-95 text-white font-bold py-3 px-5 rounded-xl shadow-lg text-base transition-all">
                    ヒット
                </button>
                <button id="btn-stand" onclick="blackjackStand()" class="hidden bg-gradient-to-b from-purple-500 to-purple-700 hover:from-purple-400 hover:to-purple-600 active:scale-95 text-white font-bold py-3 px-5 rounded-xl shadow-lg text-base transition-all">
                    スタンド
                </button>
            </div>
        </div>

    </main>

    <!-- Reset / Refill Chips Floating Notice if broke -->
    <div id="bankruptcy-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-50 p-4">
        <div class="bg-slate-800 border border-amber-500/40 p-6 rounded-2xl max-w-sm w-full text-center shadow-2xl">
            <i class="fa-solid fa-coins text-amber-400 text-5xl mb-3 animate-bounce"></i>
            <h2 class="text-xl font-bold text-white mb-2">チップが無くなりました！</h2>
            <p class="text-gray-300 text-sm mb-6">無料のレスキューチップ（1,000チップ）を受け取ってゲームを続けましょう。</p>
            <button onclick="resetChips()" class="w-full bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-bold py-3 rounded-xl hover:from-amber-300 hover:to-yellow-400 transition-all shadow-lg">
                チップを補給する
            </button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="w-full bg-black/40 border-t border-white/5 py-3 text-center text-xs text-gray-400">
        <p>Simple Trump Games &copy; Enjoy High & Low and Blackjack!</p>
    </footer>

    <script>
        /* --- Audio Engine (Web Audio API) --- */
        let soundEnabled = true;
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'flip') {
                // Card flip click sound
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(1200, now + 0.05);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'win') {
                // Winning chime
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'lose') {
                // Losing buzz
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(150, now + 0.3);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'chip') {
                // Chip click
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.03);
                osc.start(now);
                osc.stop(now + 0.03);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('btn-sound');
            btn.innerHTML = soundEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark"></i>';
            btn.classList.toggle('text-amber-400', soundEnabled);
            btn.classList.toggle('text-gray-500', !soundEnabled);
        }

        /* --- Card & Deck Mechanics --- */
        const SUITS = [
            { name: 'spades', symbol: '♠', color: 'text-slate-900' },
            { name: 'hearts', symbol: '♥', color: 'text-red-600' },
            { name: 'diamonds', symbol: '♦', color: 'text-red-600' },
            { name: 'clubs', symbol: '♣', color: 'text-slate-900' }
        ];

        const VALUES = [
            { num: 1, label: 'A' },
            { num: 2, label: '2' },
            { num: 3, label: '3' },
            { num: 4, label: '4' },
            { num: 5, label: '5' },
            { num: 6, label: '6' },
            { num: 7, label: '7' },
            { num: 8, label: '8' },
            { num: 9, label: '9' },
            { num: 10, label: '10' },
            { num: 11, label: 'J' },
            { num: 12, label: 'Q' },
            { num: 13, label: 'K' }
        ];

        class Deck {
            constructor() {
                this.cards = [];
                this.reset();
            }

            reset() {
                this.cards = [];
                for (let suit of SUITS) {
                    for (let val of VALUES) {
                        this.cards.push({
                            suit: suit.symbol,
                            color: suit.color,
                            value: val.num,
                            label: val.label
                        });
                    }
                }
                this.shuffle();
            }

            shuffle() {
                for (let i = this.cards.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [this.cards[i], this.cards[j]] = [this.cards[j], this.cards[i]];
                }
            }

            draw() {
                if (this.cards.length === 0) {
                    this.reset();
                }
                return this.cards.pop();
            }
        }

        const gameDeck = new Deck();

        /* Global Game State */
        let state = {
            mode: 'highlow', // 'highlow' or 'blackjack'
            chips: 1000,
            bet: 100,
            streak: 0
        };

        /* Helper function to generate Card HTML DOM Element */
        function createCardElement(card, isFaceUp = true, customSize = '') {
            const wrapper = document.createElement('div');
            wrapper.className = `w-20 h-28 md:w-24 md:h-36 perspective-1000 ${customSize}`;
            
            const inner = document.createElement('div');
            inner.className = `card-inner w-full h-full relative rounded-xl shadow-lg border border-slate-300/30 ${isFaceUp ? '' : 'is-flipped'}`;

            // Card Front (Visible when face up)
            const front = document.createElement('div');
            front.className = `card-front absolute inset-0 bg-gradient-to-br from-white to-gray-100 rounded-xl p-2 flex flex-col justify-between ${card ? card.color : ''}`;
            if (card) {
                front.innerHTML = `
                    <div class="flex flex-col leading-none items-start">
                        <span class="text-xs md:text-sm font-bold">${card.label}</span>
                        <span class="text-xs md:text-sm">${card.suit}</span>
                    </div>
                    <div class="text-center text-xl md:text-3xl font-bold">${card.suit}</div>
                    <div class="flex flex-col leading-none items-end rotate-180">
                        <span class="text-xs md:text-sm font-bold">${card.label}</span>
                        <span class="text-xs md:text-sm">${card.suit}</span>
                    </div>
                `;
            }

            // Card Back (Pattern)
            const back = document.createElement('div');
            back.className = `card-back absolute inset-0 bg-gradient-to-br from-blue-700 to-indigo-900 rounded-xl border-2 border-white/80 p-1 flex items-center justify-center`;
            back.innerHTML = `
                <div class="w-full h-full border border-blue-400/40 rounded-lg flex items-center justify-center bg-[radial-gradient(#3b82f6_1px,transparent_1px)] [background-size:8px_8px]">
                    <i class="fa-solid fa-gem text-blue-300/50 text-xl"></i>
                </div>
            `;

            inner.appendChild(front);
            inner.appendChild(back);
            wrapper.appendChild(inner);

            return { wrapper, inner };
        }

        /* --- Chip & Bet Management --- */
        function updateHUD() {
            document.getElementById('chips-display').textContent = state.chips.toLocaleString();
            document.getElementById('bet-display').textContent = state.bet.toLocaleString();
            document.getElementById('score-display').textContent = state.streak;

            if (state.chips <= 0 && state.bet === 0) {
                document.getElementById('bankruptcy-modal').classList.remove('hidden');
            }
        }

        function adjustBet(amount) {
            playSound('chip');
            const newBet = state.bet + amount;
            if (newBet >= 10 && newBet <= state.chips) {
                state.bet = newBet;
            } else if (newBet > state.chips) {
                state.bet = state.chips;
            } else if (newBet < 10) {
                state.bet = Math.min(10, state.chips);
            }
            updateHUD();
        }

        function resetChips() {
            state.chips = 1000;
            state.bet = 100;
            document.getElementById('bankruptcy-modal').classList.add('hidden');
            updateHUD();
        }

        /* Mode Switcher */
        function switchGameMode(mode) {
            if (state.mode === mode) return;
            playSound('chip');
            state.mode = mode;

            const btnHL = document.getElementById('btn-mode-hl');
            const btnBJ = document.getElementById('btn-mode-bj');
            const hlSection = document.getElementById('highlow-game');
            const bjSection = document.getElementById('blackjack-game');
            const scoreLabel = document.getElementById('score-label');

            if (mode === 'highlow') {
                btnHL.className = "px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition-all duration-200 bg-amber-500 text-black shadow-md";
                btnBJ.className = "px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition-all duration-200 text-gray-300 hover:text-white";
                hlSection.classList.remove('hidden');
                bjSection.classList.add('hidden');
                scoreLabel.textContent = "連勝 (Streak)";
                initHighLow();
            } else {
                btnBJ.className = "px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition-all duration-200 bg-amber-500 text-black shadow-md";
                btnHL.className = "px-3 py-1.5 rounded-lg text-xs md:text-sm font-semibold transition-all duration-200 text-gray-300 hover:text-white";
                bjSection.classList.remove('hidden');
                hlSection.classList.add('hidden');
                scoreLabel.textContent = "勝利数 (Wins)";
                initBlackjackUI();
            }
            updateHUD();
        }

        /* --- HIGH & LOW GAME LOGIC --- */
        let hlCurrentCard = null;
        let hlNextCard = null;
        let hlIsPlaying = false;

        function initHighLow() {
            hlIsPlaying = false;
            hlCurrentCard = gameDeck.draw();
            renderHLCard('hl-card-1', hlCurrentCard, true);
            renderHLCard('hl-card-2', null, false); // Hidden card
            document.getElementById('hl-message').innerHTML = '<p class="text-lg md:text-xl font-bold text-amber-100">次のカードは現在のカードより【高い】か【低い】か？</p>';
            document.getElementById('hl-bet-controls').classList.remove('opacity-50', 'pointer-events-none');
        }

        function renderHLCard(elementId, card, isFaceUp) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';
            const cardObj = createCardElement(card, isFaceUp, 'w-full h-full');
            container.appendChild(cardObj.wrapper);
            return cardObj;
        }

        function playHighLow(guess) {
            if (hlIsPlaying) return;
            if (state.chips < state.bet) {
                document.getElementById('hl-message').innerHTML = '<p class="text-red-400 font-bold">チップが不足しています！</p>';
                return;
            }

            hlIsPlaying = true;
            document.getElementById('hl-bet-controls').classList.add('opacity-50', 'pointer-events-none');

            hlNextCard = gameDeck.draw();
            playSound('flip');

            // Render and flip next card
            const container = document.getElementById('hl-card-2');
            container.innerHTML = '';
            const nextCardObj = createCardElement(hlNextCard, false, 'w-full h-full');
            container.appendChild(nextCardObj.wrapper);

            setTimeout(() => {
                nextCardObj.inner.classList.remove('is-flipped');
            }, 100);

            // Calculate Result after flip animation
            setTimeout(() => {
                const curVal = hlCurrentCard.value;
                const nextVal = hlNextCard.value;
                let won = false;
                let tie = false;

                if (nextVal === curVal) {
                    tie = true;
                } else if (guess === 'HIGH' && nextVal > curVal) {
                    won = true;
                } else if (guess === 'LOW' && nextVal < curVal) {
                    won = true;
                }

                const msgBox = document.getElementById('hl-message');

                if (tie) {
                    playSound('chip');
                    msgBox.innerHTML = `<p class="text-yellow-300 font-bold text-xl">引き分け (DRAW)！ ベットが返却されました。</p>`;
                } else if (won) {
                    playSound('win');
                    state.streak++;
                    const winAmount = state.bet;
                    state.chips += winAmount;
                    msgBox.innerHTML = `<p class="text-emerald-400 font-bold text-xl">正解！ +${winAmount} チップ獲得！</p>`;
                } else {
                    playSound('lose');
                    state.streak = 0;
                    state.chips -= state.bet;
                    msgBox.innerHTML = `<p class="text-rose-400 font-bold text-xl">不正解... -${state.bet} チップ</p>`;
                }

                if (state.bet > state.chips) {
                    state.bet = Math.max(10, state.chips);
                }

                updateHUD();

                // Prepare next round after short delay
                setTimeout(() => {
                    hlCurrentCard = hlNextCard;
                    renderHLCard('hl-card-1', hlCurrentCard, true);
                    renderHLCard('hl-card-2', null, false);
                    document.getElementById('hl-bet-controls').classList.remove('opacity-50', 'pointer-events-none');
                    hlIsPlaying = false;
                }, 2000);

            }, 700);
        }

        /* --- BLACKJACK GAME LOGIC --- */
        let bjPlayerHand = [];
        let bjDealerHand = [];
        let bjGameActive = false;
        let bjDealerHiddenCardObj = null;

        function initBlackjackUI() {
            document.getElementById('dealer-cards').innerHTML = '';
            document.getElementById('player-cards').innerHTML = '';
            document.getElementById('dealer-score').textContent = '?';
            document.getElementById('player-score').textContent = '0';
            document.getElementById('bj-message').innerHTML = '<p class="text-base md:text-lg font-bold text-amber-100">ベット額を決めて【ディール】を押してください</p>';

            document.getElementById('btn-deal').classList.remove('hidden');
            document.getElementById('btn-hit').classList.add('hidden');
            document.getElementById('btn-stand').classList.add('hidden');
            document.getElementById('bj-bet-controls').classList.remove('opacity-50', 'pointer-events-none');
            bjGameActive = false;
        }

        function calculateBJScore(hand) {
            let score = 0;
            let aces = 0;

            for (let card of hand) {
                if (card.value === 1) {
                    aces++;
                    score += 11;
                } else if (card.value >= 10) {
                    score += 10;
                } else {
                    score += card.value;
                }
            }

            while (score > 21 && aces > 0) {
                score -= 10;
                aces--;
            }

            return score;
        }

        function startBlackjackHand() {
            if (state.chips < state.bet) {
                document.getElementById('bj-message').innerHTML = '<p class="text-red-400 font-bold">チップが不足しています！</p>';
                return;
            }

            bjGameActive = true;
            bjPlayerHand = [];
            bjDealerHand = [];

            document.getElementById('dealer-cards').innerHTML = '';
            document.getElementById('player-cards').innerHTML = '';
            document.getElementById('bj-bet-controls').classList.add('opacity-50', 'pointer-events-none');

            document.getElementById('btn-deal').classList.add('hidden');
            document.getElementById('btn-hit').classList.remove('hidden');
            document.getElementById('btn-stand').classList.remove('hidden');

            // Deal initial hands
            bjPlayerHand.push(gameDeck.draw());
            bjDealerHand.push(gameDeck.draw()); // Face Up
            bjPlayerHand.push(gameDeck.draw());
            bjDealerHand.push(gameDeck.draw()); // Face Down

            // Render Player Cards
            bjPlayerHand.forEach(card => {
                const cardObj = createCardElement(card, true);
                document.getElementById('player-cards').appendChild(cardObj.wrapper);
            });

            // Render Dealer Cards
            const dCard1 = createCardElement(bjDealerHand[0], true);
            document.getElementById('dealer-cards').appendChild(dCard1.wrapper);

            bjDealerHiddenCardObj = createCardElement(bjDealerHand[1], false);
            document.getElementById('dealer-cards').appendChild(bjDealerHiddenCardObj.wrapper);

            playSound('flip');

            const pScore = calculateBJScore(bjPlayerHand);
            document.getElementById('player-score').textContent = pScore;
            document.getElementById('dealer-score').textContent = calculateBJScore([bjDealerHand[0]]);

            document.getElementById('bj-message').innerHTML = '<p class="text-base md:text-lg font-bold text-amber-100">ヒット（引く）か スタンド（勝負）を選択</p>';

            // Check Natural Blackjack
            if (pScore === 21) {
                blackjackStand();
            }
        }

        function blackjackHit() {
            if (!bjGameActive) return;

            const card = gameDeck.draw();
            bjPlayerHand.push(card);

            const cardObj = createCardElement(card, true);
            document.getElementById('player-cards').appendChild(cardObj.wrapper);
            playSound('flip');

            const pScore = calculateBJScore(bjPlayerHand);
            document.getElementById('player-score').textContent = pScore;

            if (pScore > 21) {
                // Bust
                endBlackjackRound('BUST');
            } else if (pScore === 21) {
                blackjackStand();
            }
        }

        function blackjackStand() {
            if (!bjGameActive) return;
            bjGameActive = false;

            // Reveal Dealer Hidden Card
            bjDealerHiddenCardObj.inner.classList.remove('is-flipped');
            playSound('flip');

            let dScore = calculateBJScore(bjDealerHand);
            document.getElementById('dealer-score').textContent = dScore;

            // Dealer draws until 17 or higher
            const dealerDrawInterval = setInterval(() => {
                if (dScore < 17) {
                    const card = gameDeck.draw();
                    bjDealerHand.push(card);
                    const cardObj = createCardElement(card, true);
                    document.getElementById('dealer-cards').appendChild(cardObj.wrapper);
                    playSound('flip');
                    dScore = calculateBJScore(bjDealerHand);
                    document.getElementById('dealer-score').textContent = dScore;
                } else {
                    clearInterval(dealerDrawInterval);
                    evaluateBlackjackResult();
                }
            }, 600);
        }

        function evaluateBlackjackResult() {
            const pScore = calculateBJScore(bjPlayerHand);
            const dScore = calculateBJScore(bjDealerHand);

            if (dScore > 21) {
                endBlackjackRound('DEALER_BUST');
            } else if (pScore > dScore) {
                endBlackjackRound('WIN');
            } else if (pScore < dScore) {
                endBlackjackRound('LOSE');
            } else {
                endBlackjackRound('DRAW');
            }
        }

        function endBlackjackRound(result) {
            bjGameActive = false;
            const msgBox = document.getElementById('bj-message');

            if (result === 'BUST') {
                playSound('lose');
                state.chips -= state.bet;
                msgBox.innerHTML = `<p class="text-rose-400 font-bold text-lg">バースト！ 21を超えました (-${state.bet})</p>`;
            } else if (result === 'DEALER_BUST') {
                playSound('win');
                state.chips += state.bet;
                state.streak++;
                msgBox.innerHTML = `<p class="text-emerald-400 font-bold text-lg">ディーラーバースト！ 勝利！ (+${state.bet})</p>`;
            } else if (result === 'WIN') {
                playSound('win');
                state.chips += state.bet;
                state.streak++;
                msgBox.innerHTML = `<p class="text-emerald-400 font-bold text-lg">あなたの勝ち！ (+${state.bet})</p>`;
            } else if (result === 'LOSE') {
                playSound('lose');
                state.chips -= state.bet;
                msgBox.innerHTML = `<p class="text-rose-400 font-bold text-lg">ディーラーの勝ち (-${state.bet})</p>`;
            } else if (result === 'DRAW') {
                playSound('chip');
                msgBox.innerHTML = `<p class="text-yellow-300 font-bold text-lg">引き分け (PUSH)</p>`;
            }

            if (state.bet > state.chips) {
                state.bet = Math.max(10, state.chips);
            }

            updateHUD();

            // Reset action buttons after round ends
            document.getElementById('btn-hit').classList.add('hidden');
            document.getElementById('btn-stand').classList.add('hidden');
            document.getElementById('btn-deal').classList.remove('hidden');
            document.getElementById('bj-bet-controls').classList.remove('opacity-50', 'pointer-events-none');
        }

        /* --- Initialization --- */
        window.onload = function() {
            initHighLow();
            updateHUD();
        };
    </script>
</body>
